[package]
name = "mini-bb"
version = "0.1.0"
edition = "2021"
description = "Educational trigram code-search engine (mini Blackbird) in <500 lines of Rust"
license = "MIT"

# Dependency allowlist is fixed by SPEC.md §6 — adding one requires a spec change.
[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "mini_bb"
path = "src/lib.rs"

[[bin]]
name = "mini-bb"
path = "src/main.rs"
