[package]
name = "kafka-demo"
version = "0.1.0"
edition = "2021"
description = "Distributed mini-bb: Kafka-partitioned ingest + query fan-out (spec 003)"

# Allowlist fixed by spec 003 NF-6.
[dependencies]
mini-bb = { path = ".." }
rskafka = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
